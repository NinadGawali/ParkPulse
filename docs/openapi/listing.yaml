openapi: 3.1.0
info:
  title: ParkSmart Listing Service
  version: 1.0.0
  description: |
    Host-side supply: listings, photos (presigned uploads), weekly availability rules, blackouts,
    moderation. Owns `ParkingListing`, `ListingPhoto`, `AvailabilityRule`, `AvailabilityBlackout`,
    `ListingModerationLog`, plus local projections `host_eligibility` (from Identity/Profile events)
    and `listing_active_bookings` (from Booking events).

    Lifecycle: DRAFT -> (submit) PENDING_REVIEW -> (admin approve) PUBLISHED <-> PAUSED;
    PENDING_REVIEW -> (admin reject) REJECTED -> (edit + submit) PENDING_REVIEW;
    any non-archived -> ARCHIVED (blocked with 409 while active/future bookings exist).

    Submit requires: >= 1 confirmed photo, >= 1 availability rule, and an eligible host
    (HOST role, phone verified, profile photo set).

    Editing a PUBLISHED listing keeps it PUBLISHED, except changes to address/location, which
    send it back to PENDING_REVIEW (emits `ListingSubmittedForReview`; Search hides the listing).
    Price/policy changes never affect existing bookings (Booking snapshots them).

    Events (topic `listing.listing.v1`): ListingCreated, ListingSubmittedForReview,
    ListingPublished (approve and resume), ListingUpdated (terms or photos of a PUBLISHED/PAUSED
    listing), AvailabilityChanged (rules/blackouts of a PUBLISHED/PAUSED listing; drafts emit
    nothing), ListingPaused (also when the host is suspended), ListingRejected, ListingArchived.
    Every response carrying a listing has an ETag (its version); any change to the listing,
    photos and rules included, changes it.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: listings
  - name: photos
  - name: availability
  - name: admin
  - name: internal
paths:
  /api/v1/listings:
    post:
      tags: [listings]
      operationId: createListing
      description: HOST only. Creates a DRAFT owned by the caller.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateListingRequest' } }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: 'common.yaml#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /api/v1/listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [listings]
      operationId: getListing
      security: [{}, { bearerAuth: [] }]
      description: |
        PUBLISHED listings are public. Other statuses are visible only to the owner and ADMIN (404
        otherwise). The public view lists READY photos only and omits blackout reasons.
      responses:
        '200':
          description: Listing.
          headers:
            ETag: { $ref: 'common.yaml#/components/headers/ETag' }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
    patch:
      tags: [listings]
      operationId: updateListing
      description: |
        Owner only. Partial update; omitted fields are unchanged (an empty description clears it).
        Not allowed while PENDING_REVIEW or ARCHIVED (409). A missing If-Match is 400; a stale one 412.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateListingRequest' } }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: 'common.yaml#/components/headers/ETag' }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '412': { $ref: 'common.yaml#/components/responses/PreconditionFailed' }
    delete:
      tags: [listings]
      operationId: archiveListing
      description: Owner only. Soft delete (ARCHIVED). 409 with problem type `listing-has-active-bookings` if any booking is still active or upcoming.
      responses:
        '204': { description: Archived. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/hosts/me/listings:
    get:
      tags: [listings]
      operationId: listMyListings
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ListingStatus' }
      responses:
        '200':
          description: Caller's listings, newest first.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListingPage' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
  /api/v1/listings/{listingId}/submit:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [listings]
      operationId: submitListing
      description: Owner only. DRAFT or REJECTED -> PENDING_REVIEW. 422 `listing-not-submittable` lists the unmet requirements in `detail`.
      responses:
        '200':
          description: Submitted.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
  /api/v1/listings/{listingId}/pause:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [listings]
      operationId: pauseListing
      description: Owner only. PUBLISHED -> PAUSED. Existing bookings are honoured; no new bookings.
      responses:
        '200': { description: Paused., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/resume:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [listings]
      operationId: resumeListing
      description: Owner only. PAUSED -> PUBLISHED. 422 `host-suspended` while the host is suspended.
      responses:
        '200': { description: Resumed., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
  /api/v1/listings/{listingId}/photos/upload-urls:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [photos]
      operationId: createPhotoUploadUrl
      description: |
        Owner only. Returns a presigned PUT URL (valid 10 min). The client uploads the bytes directly
        to object storage, then calls `confirm`. Max 10 photos per listing; jpeg/png/webp; <= 10 MB.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PhotoUploadRequest' } }
      responses:
        '201':
          description: Upload slot created (photo is PENDING_UPLOAD until confirmed).
          content:
            application/json: { schema: { $ref: '#/components/schemas/PhotoUploadResponse' } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/photos/{photoId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ListingId'
      - $ref: '#/components/parameters/PhotoId'
    post:
      tags: [photos]
      operationId: confirmPhotoUpload
      description: |
        Owner only. The server copies the uploaded object to a server-owned public key, checks the
        copy's declared type, size and image signature, then marks the photo READY (the upload URL
        can no longer change it). 422 `upload-missing` / `upload-mismatch` / `upload-expired`.
      responses:
        '200': { description: Confirmed., content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
      - $ref: '#/components/parameters/PhotoId'
    delete:
      tags: [photos]
      operationId: deletePhoto
      description: Owner only (non-owner 403). 409 if it is the last READY photo of a PUBLISHED or PENDING_REVIEW listing.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/photos/order:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    put:
      tags: [photos]
      operationId: reorderPhotos
      description: |
        Owner only (non-owner 403). photoIds must list every READY photo exactly once. Photos cannot
        be added, confirmed, removed or reordered while PENDING_REVIEW (409 `listing-not-editable`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoIds]
              additionalProperties: false
              properties:
                photoIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Reordered., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/availability:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    put:
      tags: [availability]
      operationId: replaceAvailabilityRules
      description: Owner only. Replaces the weekly schedule. Times are local to the listing's `timeZone`. Rules for one day must not overlap.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AvailabilityRulesRequest' } }
      responses:
        '200': { description: Replaced., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /api/v1/listings/{listingId}/blackouts:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [availability]
      operationId: addBlackout
      description: |
        Owner only. Does not cancel existing bookings in the range (host must cancel those
        explicitly). Must end in the future and start at most 2 years ahead; at most 100 current
        blackouts (422 `blackout-limit`). Blackouts that ended more than 30 days ago are dropped.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BlackoutRequest' } }
      responses:
        '201': { description: Added., content: { application/json: { schema: { $ref: '#/components/schemas/Blackout' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
  /api/v1/listings/{listingId}/blackouts/{blackoutId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
      - name: blackoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [availability]
      operationId: deleteBlackout
      description: Owner only (non-owner 403).
      responses:
        '204': { description: Removed. }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /admin/v1/listings:
    get:
      tags: [admin]
      operationId: adminListListings
      description: ADMIN only. Moderation queue (oldest first when status=PENDING_REVIEW).
      parameters:
        - name: status
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ListingStatus' }
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200': { description: Page., content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /admin/v1/listings/{listingId}/approve:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [admin]
      operationId: approveListing
      description: |
        ADMIN only, and never for the admin's own listing (403). PENDING_REVIEW -> PUBLISHED;
        writes a moderation log entry; emits ListingPublished. 422 `host-suspended`.
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/ModerationDecisionRequest' } }
      responses:
        '200': { description: Published., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/Unprocessable' }
  /admin/v1/listings/{listingId}/reject:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    post:
      tags: [admin]
      operationId: rejectListing
      description: ADMIN only. PENDING_REVIEW -> REJECTED; reason is required and shown to the host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ModerationDecisionRequest'
                - required: [reason]
      responses:
        '200': { description: Rejected., content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /internal/v1/listings/{listingId}/booking-quote:
    parameters: [{ $ref: '#/components/parameters/ListingId' }]
    get:
      tags: [internal]
      operationId: getBookingQuote
      description: |
        Called by Booking Service while creating a booking. Not routed by the gateway.
        Requires a JWT with DRIVER (Booking forwards the driver's token); otherwise 403.
        Booking itself rejects a driver booking their own listing (hostAccountId == caller).
        Only PUBLISHED and PAUSED listings exist here (PAUSED returns `bookable: false`,
        `unbookableReason: NOT_PUBLISHED`); drafts, listings in review, rejected and archived ones
        are 404, so a forwarded token cannot read unpublished terms. Windows longer than 31 days
        are 400.
        Returns the terms Booking snapshots and whether the window fits the listing's availability
        rules and blackouts. Booking still enforces overlap with other bookings in its own DB.
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Quote., content: { application/json: { schema: { $ref: '#/components/schemas/BookingQuote' } } } }
        '400': { $ref: 'common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { $ref: 'common.yaml#/components/securitySchemes/bearerAuth' }
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, PAUSED, ARCHIVED, REJECTED]
    Amenity:
      type: string
      enum: [COVERED, GATED, CCTV, EV_CHARGER, SECURITY_GUARD, LIGHTING, WHEELCHAIR_ACCESSIBLE, TWENTY_FOUR_SEVEN_ACCESS]
    ListingTerms:
      type: object
      properties:
        title: { type: string, minLength: 5, maxLength: 255 }
        description: { type: string, maxLength: 5000 }
        address: { type: string, minLength: 5, maxLength: 512 }
        location: { $ref: 'common.yaml#/components/schemas/GeoPoint' }
        timeZone: { type: string, maxLength: 64, examples: ["Asia/Kolkata"], description: IANA zone used for availability rules. }
        pricePerHour: { $ref: 'common.yaml#/components/schemas/Money' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        maxVehicleType: { $ref: 'common.yaml#/components/schemas/VehicleType' }
        amenities:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Amenity' }
        instantBook: { type: boolean, description: false = host must approve each booking (request-to-book). }
        cancellationPolicy: { $ref: 'common.yaml#/components/schemas/CancellationPolicy' }
        bufferMinutes: { type: integer, minimum: 0, maximum: 120, multipleOf: 5, description: Turnaround time blocked after each booking. }
    CreateListingRequest:
      allOf:
        - $ref: '#/components/schemas/ListingTerms'
        - type: object
          required: [title, address, location, timeZone, pricePerHour, currency, maxVehicleType, instantBook, cancellationPolicy, bufferMinutes]
      description: pricePerHour must be within the configured bounds (default 5.00 - 2000.00 INR).
    UpdateListingRequest:
      allOf:
        - $ref: '#/components/schemas/ListingTerms'
      minProperties: 1
    Photo:
      type: object
      required: [id, url, sortOrder, status]
      properties:
        id: { type: string, format: uuid }
        url: { type: [string, 'null'], format: uri, description: CDN URL; null while PENDING_UPLOAD. }
        sortOrder: { type: integer }
        status: { type: string, enum: [PENDING_UPLOAD, READY] }
    AvailabilityRule:
      type: object
      required: [dayOfWeek, startTime, endTime]
      additionalProperties: false
      properties:
        dayOfWeek: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ["08:00"] }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$|^24:00$', examples: ["20:00"], description: Must be after startTime; 24:00 = end of day. }
    AvailabilityRulesRequest:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules:
          type: array
          maxItems: 21
          items: { $ref: '#/components/schemas/AvailabilityRule' }
    BlackoutRequest:
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string, maxLength: 255 }
    Blackout:
      allOf:
        - $ref: '#/components/schemas/BlackoutRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    ModerationDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ListingResponse:
      type: object
      required: [id, hostAccountId, status, title, address, location, timeZone, pricePerHour, currency, maxVehicleType, amenities, instantBook, cancellationPolicy, bufferMinutes, photos, availabilityRules, blackouts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        hostAccountId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ListingStatus' }
        title: { type: string }
        description: { type: [string, 'null'] }
        address: { type: string }
        location: { $ref: 'common.yaml#/components/schemas/GeoPoint' }
        timeZone: { type: string }
        pricePerHour: { $ref: 'common.yaml#/components/schemas/Money' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        maxVehicleType: { $ref: 'common.yaml#/components/schemas/VehicleType' }
        amenities: { type: array, items: { $ref: '#/components/schemas/Amenity' } }
        instantBook: { type: boolean }
        cancellationPolicy: { $ref: 'common.yaml#/components/schemas/CancellationPolicy' }
        bufferMinutes: { type: integer }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        availabilityRules: { type: array, items: { $ref: '#/components/schemas/AvailabilityRule' } }
        blackouts: { type: array, items: { $ref: '#/components/schemas/Blackout' } }
        rejectionReason: { type: [string, 'null'], description: Latest moderation reason when REJECTED. Owner/admin only. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ListingSummary:
      type: object
      required: [id, title, status, pricePerHour, currency]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/ListingStatus' }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        pricePerHour: { $ref: 'common.yaml#/components/schemas/Money' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
    ListingPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ListingSummary' } }
        nextCursor: { type: [string, 'null'] }
    PhotoUploadRequest:
      type: object
      required: [contentType, contentLength]
      additionalProperties: false
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        contentLength: { type: integer, minimum: 1, maximum: 10485760 }
    PhotoUploadResponse:
      type: object
      required: [photoId, uploadUrl, method, requiredHeaders, expiresAt]
      properties:
        photoId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: PUT }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
          description: Headers the client must send with the PUT (e.g. Content-Type).
        expiresAt: { type: string, format: date-time }
    BookingQuote:
      type: object
      required: [listingId, hostAccountId, status, bookable, pricePerHour, currency, instantBook, cancellationPolicy, bufferMinutes, maxVehicleType, timeZone]
      properties:
        listingId: { type: string, format: uuid }
        hostAccountId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ListingStatus' }
        bookable: { type: boolean, description: True when PUBLISHED and the window fits availability rules and no blackout. }
        unbookableReason:
          type: [string, 'null']
          enum: [NOT_PUBLISHED, OUTSIDE_AVAILABILITY, BLACKED_OUT, null]
        pricePerHour: { $ref: 'common.yaml#/components/schemas/Money' }
        currency: { $ref: 'common.yaml#/components/schemas/Currency' }
        instantBook: { type: boolean }
        cancellationPolicy: { $ref: 'common.yaml#/components/schemas/CancellationPolicy' }
        bufferMinutes: { type: integer }
        maxVehicleType: { $ref: 'common.yaml#/components/schemas/VehicleType' }
        timeZone: { type: string }
