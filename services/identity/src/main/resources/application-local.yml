# Local development against infra/docker-compose.yml. Secrets are read from the repo-root env
# file (generated by infra/scripts/init-local-env.sh); run from the repo root or the module dir.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/identity
    username: identity_app
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

logging:
  structured:
    format:
      console: ""   # human-readable logs locally

parksmart:
  identity:
    issuer: ${IDENTITY_ISSUER:https://identity.parksmart.local}
    jwt:
      generate-ephemeral-key: true
    dev-log-verification-codes: true
