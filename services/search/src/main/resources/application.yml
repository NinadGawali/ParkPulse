# Search Service. Every host, credential and secret comes from the environment (12-factor);
# missing values fail startup instead of falling back to defaults.
spring:
  application:
    name: search-service
  datasource:
    url: ${SEARCH_DB_URL}
    username: ${SEARCH_DB_USER}
    password: ${SEARCH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SEARCH_DB_POOL_SIZE:10}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:   # only used to publish dead letters
      acks: all
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: false   # common-web provides the handler

server:
  port: ${SEARCH_PORT:8086}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      audience: parksmart-api
      jwks-uri: ${IDENTITY_JWKS_URI}
  search:
    max-radius-km: 50
  kafka:
    partitions: 3
    replication-factor: 1
