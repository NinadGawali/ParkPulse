# Booking Service. Every host, credential and secret comes from the environment (12-factor);
# missing values fail startup instead of falling back to defaults.
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BOOKING_DB_POOL_SIZE:10}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: false   # common-web provides the handler

server:
  port: ${BOOKING_PORT:8084}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      audience: parksmart-api
      jwks-uri: ${IDENTITY_JWKS_URI}
  listing:
    base-url: ${LISTING_URI}
    timeout: 2s
  booking:
    timers:
      interval: 30s
  kafka:
    partitions: 3
    replication-factor: 1
