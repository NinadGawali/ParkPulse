# Notification Service. Every host, credential and secret comes from the environment (12-factor);
# missing values fail startup instead of falling back to defaults.
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${NOTIFICATION_DB_POOL_SIZE:10}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:   # only used to publish dead letters
      acks: all
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: false   # common-web provides the handler

server:
  port: ${NOTIFICATION_PORT:8087}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      audience: parksmart-api
      jwks-uri: ${IDENTITY_JWKS_URI}
  notification:
    email: ${NOTIFICATION_EMAIL_SENDER}    # local/test: log; aws: a real adapter (SES)
    sms: ${NOTIFICATION_SMS_SENDER}        # local/test: log; aws: a real adapter
    dev-log-bodies: false                  # true only locally: prints message bodies (codes!)
    dispatch:
      interval: 5s
      max-attempts: 5
  kafka:
    partitions: 3
    replication-factor: 1
