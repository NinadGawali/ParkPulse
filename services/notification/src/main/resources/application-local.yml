# Local development against infra/docker-compose.yml. Secrets are read from the repo-root env
# file (generated by infra/scripts/init-local-env.sh); run from the repo root or the module dir.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/notification
    username: notification_app
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

logging:
  structured:
    format:
      console: ""   # human-readable logs locally

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:https://identity.parksmart.local}
      jwks-uri: http://localhost:${IDENTITY_PORT:8081}/.well-known/jwks.json
  notification:
    email: log
    sms: log
    dev-log-bodies: true   # DEV ONLY: verification codes appear in this log
