# Local development against infra/docker-compose.yml. Secrets are read from the repo-root env
# file (generated by infra/scripts/init-local-env.sh); run from the repo root or the module dir.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/profile
    username: profile_app
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

logging:
  structured:
    format:
      console: ""   # human-readable logs locally

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:https://identity.parksmart.local}
      jwks-uri: http://localhost:${IDENTITY_PORT:8081}/.well-known/jwks.json
  profile:
    allow-fake-processor: true
  storage:
    endpoint: http://localhost:${S3_PORT:9000}
    region: us-east-1
    bucket: ${PROFILE_PHOTOS_BUCKET:parksmart-profile-photos}
    public-base-url: http://localhost:${S3_PORT:9000}/${parksmart.storage.bucket}
    path-style-access: true
    create-bucket: true
