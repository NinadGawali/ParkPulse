# Admin BFF. No database and no Kafka: every view is composed from the owning services' REST APIs
# with the caller's token forwarded. Every host and URL comes from the environment (12-factor);
# missing values fail startup instead of falling back to defaults.
spring:
  application:
    name: admin-bff-service
  mvc:
    problemdetails:
      enabled: false   # common-web provides the handler

server:
  port: ${ADMIN_BFF_PORT:8089}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      audience: parksmart-api
      jwks-uri: ${IDENTITY_JWKS_URI}
  downstream:
    # Short timeouts: an admin screen should degrade, not hang. Applied to connect and read.
    timeout: ${ADMIN_BFF_DOWNSTREAM_TIMEOUT:2s}
    listing-url: ${LISTING_URI}
    profile-url: ${PROFILE_URI}
    booking-url: ${BOOKING_URI}
    payment-url: ${PAYMENT_URI}
    review-url: ${REVIEW_URI}
