# AWS (ECS/EKS). All values are injected as environment variables from Secrets Manager / SSM:
# PAYMENT_DB_URL (must use sslmode=verify-full), PAYMENT_DB_USER, PAYMENT_DB_PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS (MSK, TLS listener), IDENTITY_ISSUER, IDENTITY_JWKS_URI,
# The fake processor is refused on aws (parksmart.payment.processor must name a real adapter).
spring:
  kafka:
    # TLS to MSK. IAM/SASL auth is added with the Terraform phase (aws-msk-iam-auth).
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}

parksmart:
  payment:
    processor: ${PAYMENT_PROCESSOR}
  require-db-tls: true
  kafka:
    replication-factor: 3
