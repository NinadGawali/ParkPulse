# Payment Service. Every host, credential and secret comes from the environment (12-factor);
# missing values fail startup instead of falling back to defaults.
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:10}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: false   # common-web provides the handler

server:
  port: ${PAYMENT_PORT:8085}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

parksmart:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      audience: parksmart-api
      jwks-uri: ${IDENTITY_JWKS_URI}
  payment:
    processor: ${PAYMENT_PROCESSOR}   # local/test: fake; aws: a real adapter
    payouts:
      cron: "0 0 2 * * MON"   # Mondays 02:00 UTC: pays out the previous week
  kafka:
    partitions: 3
    replication-factor: 1
